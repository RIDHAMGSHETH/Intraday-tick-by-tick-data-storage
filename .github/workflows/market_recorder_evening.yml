name: "Market Recorder - Evening Session (MCX Commodities Night)"

on:
  schedule:
    # 11:25 UTC = 16:55 PM IST (Monday to Friday)
    - cron: '25 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record-evening-market:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Evening MCX Session (17:00-23:35 IST)
        env:
          KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}
          KOTAK_MOBILE_NUMBER: ${{ secrets.KOTAK_MOBILE_NUMBER }}
          KOTAK_UCC: ${{ secrets.KOTAK_UCC }}
          KOTAK_MPIN: ${{ secrets.KOTAK_MPIN }}
          KOTAK_TOTP_SECRET: ${{ secrets.KOTAK_TOTP_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python engine/run_cloud_session.py --session evening --max-minutes 345

      - name: Commit & Push EOD Datasets to GitHub
        if: always()
        run: |
          git config user.name "MarketRecorderBot"
          git config user.email "bot@marketrecorder.internal"
          git add data/*/20*/*1min_bars*.csv data/*/20*/*tape*.csv || true
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Auto-record 1-min bars & tape for $(date +'%Y-%m-%d') [Evening Session]"
            git pull --rebase origin main || true
            git push origin main
          fi
